apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-nginx-ingress
  namespace: model-serving
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "{{ .Release.Name }}"
    nginx.ingress.kubernetes.io/enable-websockets: "true"
spec:
  rules:
    - host: mlops-agentic.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}
              port:
                number: 30000
                number: 80

        - path: /docs
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}
              port:
                number: 30000
                number: 80

        - path: /openapi.json
          pathType: Prefix
          backend:
            service:
              name: {{ .Release.Name }}
              port:
                number: 30000
                number: 80
